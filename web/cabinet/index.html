<!doctype html>
<html lang="{{language}}" data-surface="cabinet"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{seo_title}}</title><meta name="description" content="{{seo_description}}"><meta name="robots" content="{{robots}}"><link rel="canonical" href="{{page_url}}"><link rel="alternate" hreflang="ru" href="{{origin}}/"><link rel="alternate" hreflang="en" href="{{origin}}/?lang=en"><meta property="og:type" content="website"><meta property="og:title" content="{{seo_title}}"><meta property="og:description" content="{{seo_description}}"><meta property="og:url" content="{{page_url}}"><meta property="og:image" content="{{og_image}}"><link rel="icon" href="{{favicon}}"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/guided.css"><link rel="stylesheet" href="/cabinet.css"></head>
<body class="public-site"><header class="app-header"><a id="brand" href="/" aria-label="{{brand}}"><img src="{{logo}}" alt="{{brand}}"></a><div class="header-actions"><button id="refresh" class="small-btn" data-ct-label="Обновить данные" aria-label="Обновить данные" data-ct="Обновить">Обновить</button><button class="icon-btn" id="profile" aria-label="Аккаунт"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg></button></div></header>
<aside id="desktopNav" hidden></aside><main id="root" aria-live="polite"><section class="landing-hero"><div><h1>{{headline}}</h1><p>{{description}}</p><a class="btn" href="#tariffs">Выбрать тариф</a><a href="#login">У меня уже есть код</a></div><ol class="landing-steps">{{steps}}</ol></section><section id="tariffs" class="public-tariffs"><h2>{{tariffs_heading}}</h2><div class="public-plans">{{tariffs}}</div></section><section class="faq">{{faq}}</section><footer>{{docs}}</footer></main>
<nav id="tabs" class="tabs" data-ct-label="Разделы" aria-label="Разделы" hidden></nav><dialog id="sheet" class="app-dialog"></dialog><div id="notice" class="app-toast" role="status" hidden></div><script src="/customer-en.js?v=20260914-access2"></script><script src="/customer-i18n.js"></script><script src="/app.js?v=20260914-access2"></script><script src="/customer-ui.js?v=20260914-access2"></script></body></html>
